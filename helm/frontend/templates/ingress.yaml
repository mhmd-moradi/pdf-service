{{/* same pattern as api ingress — disabled on minikube, enabled on EKS via Flux HelmRelease values */}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "frontend.fullname" . }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  # "alb" — same controller as the API ingress;
  # each Ingress creates its own ALB unless you use the group annotation to share one
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "frontend.fullname" . }}
                port:
                  # 80 — ALB sends traffic to the Service which forwards to nginx on port 80
                  number: {{ .Values.service.port }}
{{- end }}
