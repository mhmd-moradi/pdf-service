apiVersion: v1
kind: Secret
metadata:
  # Hardcoded name; api and worker charts reference this exact string in postgresSecretName
  name: postgres-credentials
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
# Opaque = arbitrary key-value data (base64-encoded internally);
# other types like kubernetes.io/tls have enforced key names
type: Opaque
# stringData vs data: stringData accepts plaintext — Kubernetes base64-encodes it automatically when storing;
# data: requires you to base64-encode values yourself
stringData:
  # Helm renders this from values.yaml; in production this value should come from a
  # Secrets Manager (AWS SSM/Secrets Manager + ESO) not be committed to git
  password: {{ .Values.postgres.password | quote }}
