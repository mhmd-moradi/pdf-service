apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: api
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: default
  releaseName: api
  upgrade:
    force: true
  dependsOn:
    - name: shared-storage
    - name: redis
    - name: aws-load-balancer-controller
  chart:
    spec:
      chart: ./helm/api
      sourceRef:
        kind: GitRepository
        name: pdf-service
      reconcileStrategy: Revision
  values:
    env:
      # Was "postgres-postgresql" (the in-cluster Service) -- now RDS.
      # Replace with the actual value from `terraform output rds_endpoint`.
      postgresHost: "pdf-service-dev-postgres.cve0wqswmmc6.eu-central-1.rds.amazonaws.com"
    ingress:
      enabled: true
      className: alb
      annotations:
        alb.ingress.kubernetes.io/scheme: internet-facing
        alb.ingress.kubernetes.io/target-type: ip
